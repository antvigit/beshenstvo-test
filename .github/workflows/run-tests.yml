name: Run Tests

on:
  # Плановый ночной прогон — заготовка, сознательно выключена (не расходуем
  # минуты CI и не шлём уведомления в бот, пока в этом нет реальной нужды).
  # Чтобы включить: раскомментировать блок ниже и завести секрет
  # DEFAULT_CHAT_ID (у планового запуска нет "нажавшего кнопку" пользователя,
  # поэтому chat_id берём из секрета, а не из inputs — см. шаг
  # "Send initial message"). Время в UTC, '0 2 * * *' = 05:00 по Москве.
  #
  # schedule:
  #   - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Telegram chat ID'
        required: true
        type: string
      test_class:
        description: 'Раздел сайта для тестирования'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - VaccinationCalculatorTest
          - RheumatologyCalculatorTest
          - RadiologySiteTest
          - VaccinationApiTest
      browser:
        description: 'Браузер(ы) для запуска'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - chrome
          - firefox

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      browsers: ${{ steps.set.outputs.browsers }}
    steps:
      - name: Resolve browser matrix from input
        id: set
        run: |
          case "${{ github.event.inputs.browser }}" in
            chrome) echo 'browsers=["chrome"]' >> "$GITHUB_OUTPUT" ;;
            firefox) echo 'browsers=["firefox"]' >> "$GITHUB_OUTPUT" ;;
            *) echo 'browsers=["chrome","firefox"]' >> "$GITHUB_OUTPUT" ;;
          esac

  test:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        browser: ${{ fromJson(needs.setup.outputs.browsers) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Send initial message for ${{ matrix.browser }}
        id: init_msg
        env:
          TEST_CLASS: ${{ github.event.inputs.test_class }}
        run: |
          SECTION_LABEL="${TEST_CLASS:-all}"
          [ "$SECTION_LABEL" = "all" ] && SECTION_LABEL="все разделы"
          RESP=$(curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ github.event.inputs.chat_id }} \
            -d text="🚀 Запускаю тесты ($SECTION_LABEL) для ${{ matrix.browser }}...")
          echo "message_id=$(echo $RESP | jq '.result.message_id')" >> $GITHUB_OUTPUT
          echo "chat_id=${{ github.event.inputs.chat_id }}" >> $GITHUB_OUTPUT
          echo "token=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> $GITHUB_OUTPUT
          echo "section_label=$SECTION_LABEL" >> $GITHUB_OUTPUT

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Start Selenium Grid
        run: |
          docker compose up -d
          sleep 10

      - name: Wait for Selenium Grid to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:4444/status | grep -Eq '"ready":\s*true'; then
              echo "Grid is ready"
              break
            fi
            echo "Waiting for Grid..."
            sleep 2
          done

      - name: Edit message - tests started
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ steps.init_msg.outputs.token }}/editMessageText \
            -d chat_id=${{ steps.init_msg.outputs.chat_id }} \
            -d message_id=${{ steps.init_msg.outputs.message_id }} \
            -d "text=🚀 Запускаю тесты (${{ steps.init_msg.outputs.section_label }}) для ${{ matrix.browser }}...%0A⏳ Выполняются тесты..."

      - name: Build test image
        run: docker build -t beshenstvo-tests -f Dockerfile .

      - name: Run tests for ${{ matrix.browser }} (in Docker)
        env:
          TEST_CLASS: ${{ github.event.inputs.test_class }}
        run: |
          mkdir -p target
          if [ -n "$TEST_CLASS" ] && [ "$TEST_CLASS" != "all" ]; then
            MVN_ARGS="-Dtest=$TEST_CLASS"
          else
            MVN_ARGS=""
          fi
          # --network host: контейнер обращается к Selenium Grid на localhost:4444,
          # запущенном docker compose на самом раннере. Контейнер пишет в volume от
          # имени root (образ maven:3.8-openjdk-11 не создаёт отдельного пользователя,
          # а --user ломает поиск ~/.m2 внутри контейнера — Maven резолвит репозиторий
          # от $HOME, который для произвольного UID не задан).
          # "mvn test" вместо "mvn clean test": target/ — смонтированная с хоста
          # директория, а не файл внутри образа, и "clean" пытается удалить сам
          # каталог-точку монтирования, а не только его содержимое.
          docker run --rm --network host \
            -v "$PWD/target:/app/target" \
            beshenstvo-tests \
            mvn test $MVN_ARGS -Dbrowser=${{ matrix.browser }} -Dgrid.url=http://localhost:4444/wd/hub || true

          # На нативном Linux (в отличие от Docker Desktop for Mac, где это
          # транслируется прозрачно) файлы, написанные root'ом в контейнере, реально
          # становятся root-owned на хосте — следующий шаг (mvn allure:report, уже
          # без Docker) не может писать executor.json в target/allure-results от имени
          # обычного пользователя раннера. Возвращаем владение раннеру; sudo здесь
          # беспарольный на GitHub-hosted раннерах.
          sudo chown -R "$(id -u):$(id -g)" target

      - name: Edit message - tests finished
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ steps.init_msg.outputs.token }}/editMessageText \
            -d chat_id=${{ steps.init_msg.outputs.chat_id }} \
            -d message_id=${{ steps.init_msg.outputs.message_id }} \
            -d "text=🚀 Запускаю тесты (${{ steps.init_msg.outputs.section_label }}) для ${{ matrix.browser }}...%0A✅ Тесты завершены.%0A📊 Генерирую отчёт..."

      - name: Wait for Allure results
        run: |
          while [ ! -d target/allure-results ] || [ -z "$(ls -A target/allure-results 2>/dev/null)" ]; do
            echo "Waiting for allure-results..."
            sleep 5
          done

      - name: Generate Allure report
        run: mvn allure:report

      - name: Edit message - report generated
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ steps.init_msg.outputs.token }}/editMessageText \
            -d chat_id=${{ steps.init_msg.outputs.chat_id }} \
            -d message_id=${{ steps.init_msg.outputs.message_id }} \
            -d "text=🚀 Запускаю тесты (${{ steps.init_msg.outputs.section_label }}) для ${{ matrix.browser }}...%0A✅ Тесты завершены.%0A📊 Отчёт сгенерирован.%0A📸 Делаю скриншот..."

      - name: Start Python HTTP server
        run: |
          cd target/site/allure-maven-plugin/
          python3 -m http.server 8080 &
          sleep 5

      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server..."
            sleep 2
          done

      - name: Install Playwright
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium

      - name: Take screenshot
        run: |
          npx playwright screenshot \
            --viewport-size=1280,720 \
            --timeout=30000 \
            --wait-for-timeout=10000 \
            http://localhost:8080 \
            allure-report.png

      - name: Send screenshot and delete status message
        run: |
          if [ -f allure-report.png ]; then
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendPhoto \
              -F chat_id=${{ github.event.inputs.chat_id }} \
              -F photo=@allure-report.png \
              -F caption="📊 Allure отчёт для ${{ matrix.browser }}"
            curl -s -X POST https://api.telegram.org/bot${{ steps.init_msg.outputs.token }}/deleteMessage \
              -d chat_id=${{ steps.init_msg.outputs.chat_id }} \
              -d message_id=${{ steps.init_msg.outputs.message_id }}
          else
            echo "Screenshot not found, skip sending"
          fi