name: Test Bot

on:
  push:
    branches: [master]
    paths:
      - 'bot/**'
      - '.github/workflows/test-bot.yml'
  pull_request:
    paths:
      - 'bot/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r bot/requirements.txt -r bot/requirements-test.txt

      - name: Run bot unit tests
        run: pytest bot/test_bot.py -v
