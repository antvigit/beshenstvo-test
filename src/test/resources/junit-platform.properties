# Включаем параллельный запуск
junit.jupiter.execution.parallel.enabled = true
# Параллелизм на уровне методов внутри класса (каждый тест поднимает свой WebDriver,
# поэтому методы независимы и безопасны для параллельного запуска)
junit.jupiter.execution.parallel.mode.default = concurrent
# Классы — последовательно: одновременный запуск нескольких тестовых классов означает
# несколько реальных браузеров разом, что на CI/локально даёт нехватку ресурсов
# (таймауты, ElementClickIntercepted из-за замедленного рендера) и вдобавок путает
# атрибуцию отчётов между классами в surefire 3.0.0-M7 при параллельных классах.
junit.jupiter.execution.parallel.mode.classes.default = same_thread
# Стратегия: фиксированное небольшое число потоков, чтобы не открывать больше
# браузеров одновременно, чем реально тянет машина
junit.jupiter.execution.parallel.config.strategy = fixed
junit.jupiter.execution.parallel.config.fixed.parallelism = 2